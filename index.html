<!DOCTYPE html>
<html>
<head>
    <title>Form Registrasi</title>
</head>
<body>

    <h2>Form Registrasi</h2>

    <form action="" method="post" enctype="multipart/form-data">
        
        <fieldset>
            <legend>Biodata</legend>
            <table border="0" cellpadding="4">
                <tr>
                    <td width="220">Nama Mahasiswa</td>
                    <td>:</td>
                    <td><input type="text" name="nama" size="25" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td>No Induk Mahasiswa (NIM)</td>
                    <td>:</td>
                    <td><input type="text" name="nim" size="25" value="123456780"></td>
                </tr>
                <tr valign="top">
                    <td>Alamat Mahasiswa</td>
                    <td>:</td>
                    <td><textarea name="alamat" cols="40" rows="5" placeholder="Alamat Anda"></textarea></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tanggal">
                            <option value="01" selected>01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                        </select>
                        <select name="bulan">
                            <option value="Januari" selected>Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                        <select name="tahun">
                            <option value="1990" selected>1990</option>
                            <option value="1991">1991</option>
                            <option value="1992">1992</option>
                            <option value="1993">1993</option>
                            <option value="1994">1994</option>
                            <option value="1995">1995</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="jk" id="pria" value="Pria" checked>
                        <label for="pria">Pria</label>
                        <input type="radio" name="jk" id="wanita" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td>Upload Foto</td>
                    <td>:</td>
                    <td><input type="file" name="foto"></td>
                </tr>
                <tr>
                    <td>URL Website</td>
                    <td>:</td>
                    <td><input type="text" name="url_web" size="45" placeholder="URL Website Anda"></td>
                </tr>
                <tr>
                    <td>Perguruan Tinggi</td>
                    <td>:</td>
                    <td><input type="text" name="kampus" size="25"></td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Info Akun</legend>
            <table border="0" cellpadding="4">
                <tr>
                    <td width="220">Email</td>
                    <td>:</td>
                    <td><input type="email" name="email" size="25" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td>:</td>
                    <td><input type="text" name="username" size="25" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td><input type="password" name="password" size="25" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td>Ulangi Password</td>
                    <td>:</td>
                    <td><input type="password" name="repassword" size="25" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <input type="checkbox" name="skill[]" value="HTML" id="html"><label for="html"> HTML</label> &nbsp;
            <input type="checkbox" name="skill[]" value="CSS" id="css"><label for="css"> CSS</label> &nbsp;
            <input type="checkbox" name="skill[]" value="Javascript" id="js"><label for="js"> Javascript</label> &nbsp;
            <input type="checkbox" name="skill[]" value="PHP" id="php"><label for="php"> PHP</label> &nbsp;
            <input type="checkbox" name="skill[]" value="MySQL" id="mysql"><label for="mysql"> MySQL</label> &nbsp;
            <input type="checkbox" name="skill[]" value="Laravel" id="laravel"><label for="laravel"> Laravel</label> &nbsp;
            <input type="checkbox" name="skill[]" value="React Native" id="rn"><label for="rn"> React Native</label>
        </fieldset>

        <br>
        <input type="reset" value="Reset">
        <input type="submit" value="Simpan">
        <input type="button" value="Button" onclick="alert('Tombol Button ditekan!')">

    </form>
</body>
</html>
